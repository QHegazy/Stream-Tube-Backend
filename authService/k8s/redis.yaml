apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-redis
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-redis
  template:
    metadata:
      labels:
        app: auth-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              value: "redis_password"
          command: ["redis-server", "--requirepass", "redis_password"]

---
apiVersion: v1
kind: Service
metadata:
  name: auth-redis
  namespace: auth
spec:
  ports:
    - port: 6379
  selector:
    app: auth-redis
