apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-pgadmin
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-pgadmin
  template:
    metadata:
      labels:
        app: auth-pgadmin
    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:latest
          ports:
            - containerPort: 80
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: "admin@admin.com"
            - name: PGADMIN_DEFAULT_PASSWORD
              value: "admin"
          volumeMounts:
            - name: pgadmin-data
              mountPath: /var/lib/pgadmin
      volumes:
        - name: pgadmin-data
          persistentVolumeClaim:
            claimName: pgadmin-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: auth-pgadmin
  namespace: auth
spec:
  type: NodePort 
  ports:
    - port: 80 
      targetPort: 80 
      nodePort: 30000 
  selector:
    app: auth-pgadmin
