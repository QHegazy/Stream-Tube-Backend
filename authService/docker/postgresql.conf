# Connection Settings
listen_addresses = '*'
max_connections = 200               # Increased for better concurrency
superuser_reserved_connections = 3   # Reserve connections for maintenance
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 3

# Memory Settings
shared_buffers = '2GB'              # 25% of RAM for dedicated DB server
huge_pages = try                    # Enables huge pages for better performance
effective_cache_size = '6GB'        # 75% of RAM for dedicated DB server
work_mem = '32MB'                   # Increased for complex query operations
maintenance_work_mem = '256MB'      # Increased for maintenance operations
temp_buffers = '32MB'              # Temporary buffer size
max_stack_depth = '7MB'            # Maximum stack depth

# Disk Settings
random_page_cost = 1.1             # Optimized for SSD
effective_io_concurrency = 200     # Optimized for SSD
synchronous_commit = on            # Ensures data durability
full_page_writes = on              # Prevents partial page writes
checkpoint_timeout = 15min
max_wal_size = '2GB'              # Increased for better performance
min_wal_size = '1GB'              # Increased minimum size
checkpoint_completion_target = 0.9 # Spreads checkpoint load
wal_buffers = '16MB'              # WAL buffer size
wal_level = logical               # Enables logical replication
wal_compression = on              # Enables WAL compression
wal_writer_delay = '200ms'        # WAL writer delay

# Query Tuning
default_statistics_target = 100    # Increased for better query planning
random_page_cost = 1.1            # Optimized for SSD
cpu_tuple_cost = 0.03             # Default value
cpu_index_tuple_cost = 0.01       # Default value
cpu_operator_cost = 0.0025        # Default value
effective_io_concurrency = 200    # Optimized for SSD

# Autovacuum Settings
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = '1min'
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = '20ms'
autovacuum_vacuum_cost_limit = 2000

# Parallel Query Settings
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4
parallel_leader_participation = on

# Monitoring and Logging
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all
track_activity_query_size = 2048
log_destination = 'stderr'
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_truncate_on_rotation = on
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000   # Log slow queries
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_error_verbosity = verbose
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_min_error_statement = error

# Security Settings
ssl = on
ssl_cert_file = '/var/lib/postgresql/ssl/server.crt'
ssl_key_file = '/var/lib/postgresql/ssl/server.key'
ssl_ca_file = '/var/lib/postgresql/ssl/root.crt'   
ssl_ciphers = 'HIGH:MEDIUM:+3DES:!aNULL'
ssl_prefer_server_ciphers = on
password_encryption = scram-sha-256 

# Statement and Plan Management
shared_preload_libraries = 'pg_stat_statements'  # Enable query statistics
pg_stat_statements.max = 10000
pg_stat_statements.track = all