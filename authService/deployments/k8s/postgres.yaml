apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-postgres
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-postgres
  template:
    metadata:
      labels:
        app: auth-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "auth_user"
            - name: POSTGRES_PASSWORD
              value: "auth_password"
            - name: POSTGRES_DB
              value: "auth_db"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: auth-postgres
  namespace: auth
spec:
  ports:
    - port: 5432
  selector:
    app: auth-postgres
